<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Insight AI Agent | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#0f172a; --blue:#4f46e5; --cyan:#06b6d4; --pink:#ec4899; --muted:#64748b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#0f172a; background: radial-gradient(circle at top left, rgba(79,70,229,.35), transparent 34%), radial-gradient(circle at bottom right, rgba(6,182,212,.30), transparent 34%), linear-gradient(135deg, #0f172a 0%, #111827 45%, #312e81 100%); display:grid; place-items:center; padding:24px; }
    .card { width:min(100%, 520px); background:rgba(255,255,255,.94); border:1px solid rgba(255,255,255,.55); border-radius:32px; box-shadow:0 30px 80px rgba(15,23,42,.35); overflow:hidden; }
    .top { padding:34px 34px 22px; background:linear-gradient(135deg, rgba(79,70,229,.12), rgba(6,182,212,.12)); }
    .badge { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; background:#eef2ff; color:#4338ca; font-size:13px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; }
    h1 { margin:22px 0 8px; font-size:clamp(30px, 5vw, 44px); line-height:1; letter-spacing:-.05em; }
    .developer { margin:0; color:#475569; font-weight:700; }
    .body { padding:30px 34px 34px; }
    label { display:block; font-weight:800; margin-bottom:10px; }
    input { width:100%; border:1px solid #cbd5e1; border-radius:18px; padding:17px 18px; font-size:16px; outline:none; transition:.2s; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 4px rgba(79,70,229,.16); }
    button { width:100%; margin-top:18px; border:0; border-radius:18px; padding:16px 20px; font-size:16px; font-weight:900; color:white; background:linear-gradient(135deg, var(--blue), var(--cyan)); cursor:pointer; box-shadow:0 18px 34px rgba(79,70,229,.25); }
    .error { margin:0 0 18px; padding:14px 16px; background:#fee2e2; color:#991b1b; border:1px solid #fecaca; border-radius:18px; font-weight:800; line-height:1.45; }
    .note { margin:18px 0 0; color:var(--muted); font-size:14px; line-height:1.6; }
    .lock { width:58px; height:58px; border-radius:22px; background:linear-gradient(135deg, var(--blue), var(--pink)); display:grid; place-items:center; color:#fff; font-size:27px; box-shadow:0 18px 36px rgba(79,70,229,.25); }
  </style>
</head>
<body>
  <main class="card">
    <section class="top">
      <div class="lock">🔐</div>
      <h1>Voice Insight AI Agent</h1>
      <p class="developer">developed by a.mandal@bham.ac.uk</p>
    </section>
    <section class="body">
      <span class="badge">Private demo access</span>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post">
        <label for="password">Enter access password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <button type="submit">Start AI Agent</button>
      </form>
      <p class="note">This password protects the demo page and analysis endpoint. The OpenAI API key remains stored securely on Render.</p>
    </section>
  </main>
</body>
</html>
